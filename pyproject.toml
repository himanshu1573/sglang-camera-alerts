[project]
name = "camalerts"
version = "0.1.0"
description = "Benchmark SGLang for security-camera alerts: valid JSON, prefix caching, concurrency and quantization."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "aiohttp>=3.9",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "jsonschema>=4.20",
    "remotezip>=0.12",
    "urllib3>=2.0",
    "opencv-python-headless>=4.9",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camalerts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
